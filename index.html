<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#0b1f14;color:#e6f7ec}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GasFireGames</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: sticky-less top bar, centered 960px page, game pages as 3 panels (info | table | log). */
:root{
 --bg:#0b1f14;--bar:#07160d;--panel:#12301f;--panel2:#18402a;--inset:#0a1b12;--line:#27603f;
 --tx:#e6f7ec;--mu:#8fbfa3;--pri:#1fa65a;--pri2:#4ade80;--ok:#4ade80;--bad:#ee6a7c;
 --f:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
 color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--tx);font:14px/1.45 var(--f);min-height:100vh}
h1,h2,h3,p{margin:0}
button,input{font:inherit}
.hide{display:none!important}
.mu{color:var(--mu)}.ok{color:var(--ok)}.bad{color:var(--bad)}.r{text-align:right}

/* top bar */
.bar{background:var(--bar);border-bottom:1px solid var(--line)}
.bar-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-size:19px;font-weight:700;letter-spacing:.3px;color:var(--pri2)}
#nav{display:flex;gap:2px;overflow-x:auto;order:3;flex:1 1 100%}
@media(min-width:720px){#nav{order:0;flex:1 1 auto}}
#nav button{background:none;border:0;color:var(--mu);padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
#nav button:hover{color:var(--tx)}
#nav button.on{color:var(--tx);background:var(--panel)}
.who{display:flex;align-items:center;gap:12px;margin-left:auto}
.who .bal{color:var(--mu)}.who .bal b{color:var(--tx);font-weight:500}

/* page */
.page{max-width:960px;margin:0 auto;padding-block:26px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.ph h1{font-size:24px;font-weight:500}
.ph p{color:var(--mu);font-size:13px;margin-top:2px}
.cash{color:var(--mu);font-size:12px;text-align:right}
.cash b{font-size:17px;font-weight:500;color:var(--tx);margin-left:4px}
.g3{display:grid;grid-template-columns:200px minmax(0,1fr) 220px;gap:16px;align-items:start}
.g2{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
@media(max-width:860px){.g3,.g2{grid-template-columns:minmax(0,1fr)}}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;min-width:0}
.panel>.hd{padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:14px}
.panel>.bd{padding:16px}
.note{padding:12px 14px;font-size:12px;color:var(--mu)}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{font-weight:500;text-align:left;padding:7px 14px;color:var(--mu);font-size:12px}
.tb th.r{text-align:right}
.tb td{padding:8px 14px;border-top:1px solid var(--line)}
.tb tr.hl td{background:rgba(53,194,122,.2);font-weight:700}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:-1px}
.ri{padding:10px 14px;border-top:1px solid var(--line)}
.ri:first-child{border-top:0}
.ri .rt{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.ri small{display:block;color:var(--mu);font-size:11px;margin-top:1px}
.empty{padding:12px 14px;color:var(--mu);font-size:13px}

/* controls */
.btn{background:transparent;border:1px solid #3f8a5d;color:var(--tx);padding:7px 14px;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(255,255,255,.07)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover:not(:disabled){background:#27c06b}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--pri2);outline-offset:2px}
input{background:var(--inset);border:1px solid var(--line);color:var(--tx);padding:8px 10px;border-radius:4px;width:100%}
input:focus{border-color:var(--pri2);outline:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bet{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mu)}
.stp{display:flex}
.stp .btn{border-radius:0;color:var(--mu);padding:7px 11px}
.stp>:first-child{border-radius:4px 0 0 4px}.stp>:last-child{border-radius:0 4px 4px 0}
.stp input{width:92px;text-align:center;border-radius:0;border-left:0;border-right:0}
.stp input::-webkit-inner-spin-button{display:none}
.msg{min-height:20px;font-size:13px;margin-top:10px}
.badge{display:inline-block;background:#3d7a58;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.badge.ok{background:#198754}.badge.bad{background:#b02a37}.badge.live{background:var(--pri)}

/* auth */
.auth{max-width:360px;margin:9vh auto 0}
.auth .bd{display:flex;flex-direction:column;gap:10px}
.auth .btn{width:100%}

/* chat */
.chat{display:grid;grid-template-columns:minmax(0,1fr) 230px;height:min(72vh,580px);min-height:380px;overflow:hidden}
.cmain{display:flex;flex-direction:column;min-width:0;min-height:0}
#chatlog{flex:1;overflow-y:auto;padding:6px 18px 14px}
.mg{display:flex;gap:12px;margin-top:14px}
.av{flex:0 0 34px;height:34px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;display:grid;place-items:center;font-weight:500;color:var(--mu)}
.mb{min-width:0}
.mh2 b{font-weight:500}.mh2 span{color:var(--mu);font-size:12px;margin-left:8px}
.mt{word-break:break-word}
.cin{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.cin input{flex:1;min-width:0}
.mem{border-left:1px solid var(--line);overflow-y:auto;background:var(--panel)}
.mem .mh{display:flex;justify-content:space-between;align-items:center;padding:14px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mu);border-bottom:1px solid var(--line)}
.mem .cnt{background:var(--inset);border:1px solid var(--line);border-radius:4px;padding:0 6px;letter-spacing:0;color:var(--tx)}
.mm{display:flex;align-items:center;gap:10px;padding:8px 14px}
.mm .av{flex-basis:28px;height:28px;font-size:12px}
.mm div{min-width:0;flex:1}
.mm b{display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mm small{color:var(--mu);font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 7px}
@media(max-width:700px){.chat{grid-template-columns:minmax(0,1fr)}.mem{display:none}}

/* giveaway */
.big{font-size:38px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}

/* plinko */
.board{background:var(--inset);border:1px solid var(--line);border-radius:4px;padding:10px}
.board .top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;margin-bottom:6px}
canvas{display:block;margin:0 auto;max-width:100%;height:auto}
.dropbar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-top:14px}

/* slots */
.reels3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--inset)}
.reels3.jack{animation:shake .08s linear 12}
.rl{height:216px;position:relative;overflow:hidden;border-left:1px solid var(--line)}
.rl:first-child{border-left:0}
.strip{position:absolute;left:0;top:0;width:100%}
.strip div{height:72px;display:grid;place-items:center;font-size:34px;border-bottom:1px solid var(--line)}
.strip.blur{filter:blur(2.5px)}
.s7{font-weight:700;color:#e5384f;font-size:36px}
.pl{position:absolute;left:0;right:0;top:72px;height:72px;border-block:1px solid rgba(255,255,255,.16);pointer-events:none}
.pl.win{border-color:var(--ok);background:rgba(53,194,122,.16);animation:glow .5s ease-in-out 4}
@keyframes glow{50%{background:rgba(53,194,122,.38)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sline{text-align:center;color:var(--mu);font-size:12px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;color:var(--mu);font-size:12px;margin:18px 0}
.stats b{display:block;font-size:17px;font-weight:500;color:var(--tx);margin-top:3px}
.ctl{border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

/* blackjack */
.bjw{max-width:700px;margin:0 auto}
.felt{position:relative;background:radial-gradient(520px 260px at 50% 45%,#1f7a47,#0b3a20);border:1px solid var(--line);border-radius:4px;padding:18px 20px}
.felt .lbl{font-size:12px;color:var(--mu)}
.felt .hl{font-weight:500;margin-top:14px}
.hand{display:flex;gap:8px;flex-wrap:wrap;min-height:80px;margin:8px 0 14px}
.pc{width:54px;height:76px;background:#f4f6f8;color:#16181a;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.pc.r{color:#c4283c}
.pc.h,.deck{background:repeating-linear-gradient(45deg,#1fa65a 0 4px,#168a49 4px 8px);border:3px solid #d6f5e2;color:transparent}
.deck{position:absolute;right:11%;top:42%;width:54px;height:76px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:20px}
.deck+.dl{position:absolute;right:11%;top:calc(42% + 82px);width:54px;text-align:center;font-size:11px;color:var(--mu)}
@media(max-width:560px){.deck,.deck+.dl{display:none}}
.bjc{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.rules{font-size:12px;color:var(--mu);margin-top:14px}
.rules b{color:var(--tx)}

.av{font-size:18px}.mm .av{flex:0 0 30px;height:30px;font-size:16px}.av.lg{flex:0 0 64px;width:64px;height:64px;font-size:32px}
.m1{position:relative;padding:1px 0;outline:0}.m1 .acts{display:none;position:absolute;right:0;top:-10px;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px}.m1:hover .acts,.m1:focus-within .acts{display:flex}.m1 input{width:100%}.ed{color:var(--mu);font-size:11px}
.cim{display:block;max-width:min(280px,100%);max-height:260px;border-radius:6px;margin-top:4px;border:1px solid var(--line)}
.dmh{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:500}
.pks{display:flex;flex-wrap:wrap;gap:6px}.pk{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--inset);cursor:pointer;font-size:18px;padding:0}.pk.on{outline:2px solid var(--pri2);outline-offset:1px}
@media(max-width:700px){.chat.dm{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}.chat.dm .mem{display:block;order:-1;max-height:120px;border-left:0;border-bottom:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){.pl.win,.reels3.jack{animation:none}}

/* avatars with pictures, mentions, bots, calls */
.av{overflow:hidden}.av .avi{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.mt{white-space:pre-wrap}
.mn{color:var(--pri2);font-weight:500}.mn.me{background:rgba(74,222,128,.22);border-radius:3px;padding:0 3px}.mn.bot{color:#f9a8d4}
.m1.hit{background:rgba(74,222,128,.1);border-left:2px solid var(--pri2);padding-left:8px;margin-left:-10px}
.bt{display:inline-block;background:#3d7a58;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:1px}
.typ{min-height:18px;padding:0 18px 6px;font-size:12px;color:var(--mu)}
.cin{position:relative}
.mp{position:absolute;left:12px;bottom:calc(100% + 4px);min-width:200px;max-width:calc(100% - 24px);max-height:220px;overflow-y:auto;background:var(--panel2);border:1px solid var(--line);border-radius:6px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.mp .mi{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer}.mp .mi.on,.mp .mi:hover{background:var(--panel)}
.mp .av{flex:0 0 24px;height:24px;font-size:13px}
.toast{position:fixed;right:16px;bottom:16px;max-width:320px;background:var(--panel2);border:1px solid var(--pri2);border-radius:8px;padding:10px 14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.5);cursor:pointer;word-break:break-word}
#nav button[data-m]::after{content:' \25CF';color:#f472b6;font-size:10px}
#call{position:fixed;inset:0;z-index:50;background:rgba(3,12,7,.88);display:flex;align-items:center;justify-content:center;padding:16px}
#call .cbox{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;text-align:center}
#call .vids{position:relative;margin:12px 0;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9}
#call .vids.off{position:absolute;width:1px;height:1px;opacity:0;margin:0;pointer-events:none}
#call video{width:100%;height:100%;object-fit:cover;display:block}
#call .self{position:absolute;right:8px;bottom:8px;width:28%;height:auto;aspect-ratio:4/3;border:1px solid var(--line);border-radius:6px}
.cbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn.red{background:#b02a37;border-color:#b02a37;color:#fff}.btn.red:hover:not(:disabled){background:#c9303f}
.btn.off{background:rgba(255,255,255,.12)}
.av.sp{box-shadow:0 0 0 3px var(--pri2)}
#nav button.live::after{content:' \25CF';color:var(--ok);font-size:10px}
/* challenges: chess + blackjack duels */
select{background:var(--inset);border:1px solid var(--line);color:var(--tx);padding:8px 10px;border-radius:4px;width:100%;font:inherit}
select:focus{border-color:var(--pri2);outline:none}
.chg{display:grid;grid-template-columns:minmax(0,520px) minmax(220px,1fr);gap:16px;align-items:start}
@media(max-width:860px){.chg{grid-template-columns:minmax(0,1fr)}}
.cbw{position:relative;width:min(100%,520px)}
.cb{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;aspect-ratio:1;border-radius:3px;overflow:hidden;container-type:inline-size;user-select:none;-webkit-user-select:none}
.sq{position:relative;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden;line-height:1;background:#ebecd0}
.sq.d{background:#739552}
.sq.lm::before,.sq.sel::before{content:'';position:absolute;inset:0;background:rgba(255,255,51,.5)}
.sq.chk::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,0,0,.9) 0,rgba(231,0,0,.7) 25%,rgba(169,0,0,0) 89%)}
.chp{position:relative;z-index:1;width:100%;height:100%;display:block;pointer-events:none}
.sq.me{cursor:pointer}
.sq.mv::after{content:'';position:absolute;z-index:2;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.16)}
.sq.mv.cap::after{width:92%;height:92%;background:none;border:5px solid rgba(0,0,0,.16)}
.chp.w path,.chp.w rect,.chp.w circle{fill:#fff;stroke:#1d1d1d;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.chp.w .ln{fill:none}.chp.w .ey{fill:#1d1d1d;stroke:none}
.chp.bk path,.chp.bk rect,.chp.bk circle{fill:#4b4b4b;stroke:#141414;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.chp.bk .ln{fill:none;stroke:#a9a9a9}.chp.bk .ey{fill:#d8d8d8;stroke:none}
.sq .co{position:absolute;z-index:3;font-size:max(10px,2.7cqw);font-weight:600;font-style:normal;pointer-events:none;color:#739552}
.sq.d .co{color:#ebecd0}.sq .co.r{left:4px;top:2px}.sq .co.f{right:4px;bottom:1px}
.promo{position:absolute;inset:0;background:rgba(3,12,7,.78);display:flex;align-items:center;justify-content:center;gap:10px;z-index:3;border-radius:4px}
.promo button{width:72px;height:72px;padding:6px;background:#ebecd0;border-color:#739552}.promo button .chp{z-index:0}
.mdo{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:grid;place-items:center;padding:16px;overflow:auto}
.mdl{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;width:min(100%,440px);--tx:var(--ptx);--mu:var(--pmu);color:var(--ptx)}
.mdh{font-size:17px;margin-bottom:6px}
.crw{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.crb{position:relative;width:260px;max-width:100%;aspect-ratio:1;overflow:hidden;border-radius:6px;background:#000;cursor:grab;touch-action:none}
.crb:active{cursor:grabbing}
.crb img{width:100%;height:100%;object-fit:cover;display:block;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.crp{display:flex;flex-direction:column;gap:12px;align-items:center}
.crp .av{flex:0 0 34px;width:34px;height:34px}.crp .av.lg{flex:0 0 64px;width:64px;height:64px}
.mvl{max-height:230px;overflow-y:auto;font-size:13px;padding:10px 14px;line-height:1.8;border-top:1px solid var(--line)}
.mvl b{color:var(--mu);font-weight:400;margin-right:4px}.mvl span{margin-right:12px;display:inline-block;min-width:44px}
/* more games dropdown + arcade */
#nav button.dd .car{font-size:10px;margin-left:3px}
.ddm{position:fixed;z-index:45;min-width:230px;max-width:calc(100vw - 16px);overflow-y:auto;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 0;box-shadow:0 10px 28px rgba(0,0,0,.55)}
.ddm .ddi{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:8px 18px;cursor:pointer;font:inherit;white-space:nowrap}
.ddm .ddi:hover,.ddm .ddi:focus{background:var(--panel);outline:none}.ddm .ddi.on{color:var(--pri2)}
.ddm .ddh{padding:8px 18px 2px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mu)}
.ddm hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.gframe{width:100%;height:72vh;border:0;background:#000;display:block}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px}
.lcard{background:var(--inset);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;color:var(--tx);text-align:left;padding:0;font:inherit}
.lcard:hover,.lcard:focus{border-color:var(--pri2);outline:none}
.lcard .th{aspect-ratio:4/3;background:#0b3a20;display:grid;place-items:center;font-size:17px;font-weight:600;line-height:1.2;text-align:center;padding:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);overflow:hidden}
.lcard .th img{width:100%;height:100%;object-fit:cover;display:block}
.lcard .ti{padding:8px 10px;font-size:13px;line-height:1.25}

/* custom colors: surfaces use their own text colours so any background/area combination stays readable */
:root{--ptx:#e6f7ec;--pmu:#8fbfa3}
.panel,.bar,.toast,#call,.ddm,.mp{--tx:var(--ptx);--mu:var(--pmu)}

/* leaderboard */
.lbr{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.lbr:first-child{border-top:0}
.lbr.in{animation:lbIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes lbIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.lbr.me{background:rgba(74,222,128,.12);box-shadow:inset 3px 0 0 var(--pri2)}
.lbr.r1{background:linear-gradient(90deg,rgba(251,191,36,.22),transparent 70%)}
.lbr.r2{background:linear-gradient(90deg,rgba(203,213,225,.16),transparent 70%)}
.lbr.r3{background:linear-gradient(90deg,rgba(217,119,6,.18),transparent 70%)}
.lbr .rk{flex:0 0 38px;text-align:center;font-weight:700;color:var(--mu);font-size:15px}
.lbr .rk.m{font-size:24px;line-height:1}
.lbr .av{flex:0 0 38px;height:38px;font-size:16px}

/* admin odds editor */
.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-top:8px}
.ol{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu)}
.ol span{font-weight:700}
.oi{padding:6px 8px}
input[type=range]{accent-color:var(--pri2);cursor:pointer}

/* animated blackjack cards */
.cd{width:54px;height:76px;flex:0 0 54px;perspective:700px}
.cd .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.cd.down .in{transform:rotateY(180deg)}
.cd .f,.cd .b{position:absolute;inset:0;border-radius:6px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.cd .f{background:#f4f6f8;color:#16181a;font-weight:700;font-size:18px}
.cd.r .f{color:#c4283c}
.cd .b{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#1fa65a 0 4px,#168a49 4px 8px);border:3px solid #d6f5e2}
.cd.new{animation:dealIn .5s cubic-bezier(.2,.85,.25,1) both}
@keyframes dealIn{0%{transform:translate(var(--dx,0px),var(--dy,-50px)) rotate(-24deg) scale(.65);opacity:0}15%{opacity:1}100%{transform:none;opacity:1}}
.cd.bust .in{animation:cdBust .55s ease-in-out}
@keyframes cdBust{20%{transform:translateX(-7px) rotate(-5deg)}40%{transform:translateX(7px) rotate(5deg)}60%{transform:translateX(-5px) rotate(-3deg)}80%{transform:translateX(4px) rotate(2deg)}}
.felt{overflow:hidden}
.felt.win{animation:fWin 1.3s ease-out}
.felt.bj{animation:fBj 1.8s ease-out}
.felt.lose{animation:fLose .8s ease-out}
@keyframes fWin{0%,100%{box-shadow:inset 0 0 0 0 rgba(74,222,128,0)}30%{box-shadow:inset 0 0 60px 8px rgba(74,222,128,.55)}}
@keyframes fBj{0%,100%{box-shadow:inset 0 0 0 0 rgba(251,191,36,0)}25%,60%{box-shadow:inset 0 0 70px 12px rgba(251,191,36,.6)}}
@keyframes fLose{0%,100%{box-shadow:inset 0 0 0 0 rgba(238,106,124,0);transform:none}25%{box-shadow:inset 0 0 60px 8px rgba(238,106,124,.5);transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.vpop{display:inline-block;animation:vpop .3s ease-out}
@keyframes vpop{50%{transform:scale(1.5);color:var(--tx)}}
.fxp{position:absolute;pointer-events:none;font-weight:700;line-height:1;will-change:transform,opacity;z-index:3}
.payup{position:absolute;left:50%;top:48%;font-size:36px;font-weight:700;pointer-events:none;z-index:4;text-shadow:0 2px 10px rgba(0,0,0,.6);animation:payUp 1.7s ease-out forwards;white-space:nowrap}
@keyframes payUp{0%{opacity:0;transform:translate(-50%,-10%) scale(.5)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
@media(prefers-reduced-motion:reduce){.cd.new,.cd.bust .in,.felt.win,.felt.bj,.felt.lose,.payup,.vpop,.lbr.in{animation:none}.cd .in{transition:none}}
</style>

<script>
const $=id=>document.getElementById(id);
window.maeExportApis_=function(){};
let db,user,uid,me,authed=false,tab='chat',busy=false;
const TABS=[['chat','Chat'],['friends','Friends'],['dm','Messages'],['gcall','Global Call'],['play','Challenges'],['games','Games'],['lb','Leaderboard'],['me','Profile']];
const TL={chat:'chatroom',friends:'friends',dm:'messages',gcall:'global call',play:'challenges',me:'profile',give:'giveaway',plinko:'plinko',slots:'slots',bj:'blackjack',games:'games',lb:'leaderboard'};
const fmt=n=>Math.floor(n).toLocaleString();
let tok=localStorage.getItem('cmb_tok')||'',pend=0;
async function api(body){
 const r=await fetch('/api',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));
 if(tok&&(r.status===401||j.banned)){localStorage.removeItem('cmb_tok');tok='';alert(j.error||'Signed out');location.reload()}
 if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function authReq(body){const r=await fetch('/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
const snap=docs=>({docs:docs.map(d=>({id:d.id,data:()=>d.data})),size:docs.length,empty:!docs.length});
function coll(p,q={}){return{
 where:(f,o,v)=>coll(p,{...q,where:[...(q.where||[]),[f,o,v]]}),
 orderBy:(f,d='asc')=>coll(p,{...q,orderBy:{field:f,dir:d}}),
 limit:n=>coll(p,{...q,limit:n}),
 get:async()=>snap((await api({op:'list',path:p,query:q})).docs),
 onSnapshot:cb=>{let on=true,last='';const run=async()=>{if(!on)return;
  if(!document.hidden)try{const j=await api({op:'list',path:p,query:q}),x=JSON.stringify(j.docs);if(x!==last){last=x;cb(snap(j.docs))}}catch(e){}
  if(on)setTimeout(run,3000)};run();return()=>{on=false}}}}
const DB={doc:p=>({get:async()=>{const j=await api({op:'get',path:p});return{exists:j.exists,id:p.split('/').pop(),data:()=>j.data}},
 set:d=>api({op:'set',path:p,data:d}),update:d=>api({op:'update',path:p,data:d}),delete:()=>api({op:'delete',path:p})}),collection:coll};
const claude={use:async n=>n==='assets'?{upload:async blob=>{const d=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});return api({op:'upload',data:d})}}:null};
async function init(){
 db=DB;
 if(tok){try{const j=await api({op:'me'});uid=j.uid;me=(await db.doc('profiles/'+uid).get()).data();if(!me)throw new Error('profile missing');me.admin=j.admin;$('boot').classList.add('hide');enter();return}catch(e){console.error(e);window._err='Could not load your account: '+e.message}}
 $('boot').classList.add('hide');$('auth').classList.remove('hide');if(window._err)$('amsg').textContent=window._err;
}
const signedIn=j=>{localStorage.setItem('cmb_tok',j.token);location.reload()};
$('ru').oninput=()=>$('rk').classList.toggle('hide',$('ru').value.trim().toLowerCase()!=='hmb');
$('regb').onclick=async()=>{
 const n=$('ru').value.trim(),pw=$('rp').value;
 if(!/^[A-Za-z0-9_]{3,16}$/.test(n))return $('amsg').textContent='Username: 3-16 letters, numbers or _';
 if(pw.length<6)return $('amsg').textContent='Password must be 6+ characters';
 $('amsg').textContent='Registering...';
 try{signedIn(await authReq({op:'register',name:n,pw,key:$('rk').value}))}catch(e){$('amsg').textContent=e.message}};
$('logb').onclick=async()=>{$('amsg').textContent='Logging in...';try{signedIn(await authReq({op:'login',name:$('lu').value.trim(),pw:$('lp').value}))}catch(e){$('amsg').textContent=e.message}};
$('out').onclick=async()=>{try{await db.doc('presence/'+uid).delete()}catch(e){}localStorage.removeItem('cmb_tok');location.reload()};
async function beat(){try{await db.doc('presence/'+uid).set({uid,name:me.name,e:me.emoji,c:me.color,i:me.img||'',at:TL[tab],t:Date.now()})}catch(e){}}
function enter(){me.emoji=me.emoji||'🐸';me.color=me.color||'#1fa65a';me.bio=me.bio||'';me.status=me.status||'';
 authed=true;applyTheme(me.bg,me.pn);if(me.admin&&!TABS.some(t=>t[0]==='admin')){TABS.push(['admin','Admin']);TL.admin='admin'}$('auth').classList.add('hide');$('bar').classList.remove('hide');
 $('un').textContent=me.name;
 const tb=t=>`<button data-t="${t[0]}">${t[1]}</button>`;
 $('nav').innerHTML=TABS.filter(t=>t[0]!=='admin').map(tb).join('')+'<button id="mg" class="dd" type="button" aria-haspopup="true" aria-expanded="false">More games <span class="car">\u25BE</span></button>'+TABS.filter(t=>t[0]==='admin').map(tb).join('');
 buildMore();
 $('nav').onclick=e=>{const b=e.target.closest('button');if(!b||busy)return;if(b.id==='mg'){toggleMore();return}if(b.dataset.t)show(b.dataset.t)};
 seenT=+localStorage.getItem('cmb_seen')||Date.now();setBal();show('chat');setInterval(pollRing,2500);setInterval(pollMentions,4000);setInterval(pollGames,4000);setInterval(syncBal,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){pollMentions();pollGames()}});window.addEventListener('beforeunload',()=>{if(CALL)endCall(true);if(GC)gcLeave()});tick();setInterval(tick,1000);setInterval(beat,20000);setInterval(async()=>{if(pend||busy)return;try{const p=await db.doc('profiles/'+uid).get();if(p.exists&&!pend){me.balance=p.data().balance;setBal()}}catch(e){}},5000)}
function setBal(){document.querySelectorAll('.balv').forEach(e=>e.textContent=fmt(me.balance))}
async function pay(d){me.balance=Math.max(0,me.balance+d);setBal();pend++;try{const j=await api({op:'pay',amount:d});if(pend===1&&j&&typeof j.balance==='number'){me.balance=j.balance;setBal()}}catch(e){}pend--}
async function syncBal(){if(pend)return;try{const j=await api({op:'pay',amount:0});if(!pend&&typeof j.balance==='number'){me.balance=j.balance;setBal()}}catch(e){}}
function show(t){tab=t;[...$('nav').children].forEach(b=>{b.classList.toggle('on',b.dataset.t===t);if(b.dataset.t===t)delete b.dataset.m});
 const f={chat:vChat,admin:vAdmin,friends:vFriends,dm:vDM,gcall:vGCall,play:vPlay,me:vProfile,give:vGive,plinko:vPlinko,slots:vSlots,bj:vBJ,games:vGames,lb:vLB}[t]||vChat;markMore(t);$('tabs').innerHTML='<div id="pane"></div>';unsub();f();beat()}
let subs=[];function unsub(){subs.forEach(s=>s());subs=[]}
const ph=(t,s)=>`<div class="ph"><div><h1>${t}</h1>${s?`<p>${s}</p>`:''}</div><div class="cash">credits <b class="balv">${fmt(me.balance)}</b></div></div>`;
function adj(k){const e=$('bet');let v=Math.floor(+e.value)||1;const bal=Math.max(1,Math.floor(me.balance));
 if(k==='h')v=Math.max(1,Math.floor(v/2));else if(k==='d')v=Math.min(bal,v*2);else v=bal;e.value=v}
const betRow=(l='bet')=>`<div class="bet"><label for="bet">${l}</label><div class="stp"><button class="btn" type="button" onclick="adj('h')">½</button><input id="bet" type="number" min="1" value="50"><button class="btn" type="button" onclick="adj('d')">2×</button><button class="btn" type="button" onclick="adj('m')">max</button></div></div>`;
function getBet(){const b=Math.floor(+$('bet').value);if(!(b>=1)||b>me.balance){setMsg('Invalid bet or not enough credits',1);return 0}return b}
function setMsg(t,bad){const m=$('gm');if(m){m.textContent=t;m.className='msg '+(bad?'bad':'ok')}}
const MSG='<div class="msg" id="gm"></div>';
const fmtT=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const sgn=n=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n));

/* CHAT */
const BOTL=[['Verity','\u{1F498}','#f472b6'],['Mia','\u{1F9E0}','#38bdf8']],BOTN=['verity','mia'];
function rich(t,text){t.textContent='';String(text||'').split(/(@[A-Za-z0-9_]{2,16})/g).forEach((p,i)=>{if(!p)return;
 if(i%2){const n=p.slice(1).toLowerCase();t.append(el('span','mn'+(BOTN.includes(n)?' bot':'')+(me&&n===me.name.toLowerCase()?' me':''),p))}else t.append(document.createTextNode(p))})}
const mentionsMe=m=>!!me&&new RegExp('@'+me.name+'(?![A-Za-z0-9_])','i').test(m||'');
let botBusy={},typErr='';
function setTyp(err){if(err!=null){typErr=err;setTimeout(()=>{typErr='';setTyp()},6000)}const e=$('typ');if(!e)return;
 const n=Object.keys(botBusy).map(k=>k[0].toUpperCase()+k.slice(1));
 e.textContent=typErr||(n.length?n.join(' and ')+(n.length>1?' are':' is')+' typing\u2026':'')}
async function askBots(id,ks){ks.forEach(k=>botBusy[k]=1);setTyp();
 try{await api({op:'bot',id})}catch(e){setTyp(e.message)}
 ks.forEach(k=>delete botBusy[k]);setTyp()}
function vChat(){
 $('pane').innerHTML='<div class="panel chat"><div class="cmain"><div id="chatlog"></div><div class="typ" id="typ"></div><div class="cin"><div class="mp hide" id="mp"></div><input id="ci" maxlength="200" placeholder="message #global-chat (try @Verity or @Mia)" autocomplete="off"><button class="btn" id="cp" title="Send an image" aria-label="Send an image">\u{1F4F7}</button><button class="btn pri" id="cs">send</button></div></div><aside class="mem"><div class="mh"><span>ACTIVE MEMBERS</span><span class="cnt" id="mc">0</span></div><div id="ml"></div></aside></div>';
 let mem=[],authors={},mpi=0,mpl=[];setTyp();
 const send=async()=>{const v=$('ci').value.trim();if(!v)return;$('ci').value='';closeMp();
  const id=Date.now()+'_'+Math.random().toString(36).slice(2,6);
  try{await db.doc('chat/'+id).set({u:me.name,e:me.emoji,c:me.color,i:me.img||'',m:v.slice(0,200),t:Date.now()})}catch(e){return}
  const ks=[...new Set((v.match(/@(verity|mia)(?![A-Za-z0-9_])/gi)||[]).map(x=>x.slice(1).toLowerCase()))];
  if(ks.length)askBots(id,ks)};
 /* @ autocomplete */
 const cands=()=>{const seen=new Set(),out=[],add=(n,e,c,i,bot)=>{const k=String(n||'').toLowerCase();if(!k||seen.has(k)||k===me.name.toLowerCase())return;seen.add(k);out.push({n,e,c,i,bot})};
  BOTL.forEach(x=>add(x[0],x[1],x[2],'',1));mem.forEach(m=>add(m.name,0,m.c,m.i));Object.entries(authors).forEach(([n,a])=>add(n,0,a.c,a.i));return out};
 const closeMp=()=>{const P=$('mp');if(P)P.classList.add('hide');mpl=[]};
 const drawMp=()=>{const i=$('ci');if(!i)return;const m=/@([A-Za-z0-9_]*)$/.exec(i.value.slice(0,i.selectionStart));if(!m)return closeMp();
  const q=m[1].toLowerCase();mpl=cands().filter(x=>x.n.toLowerCase().startsWith(q)).slice(0,6);
  const P=$('mp');P.textContent='';if(!mpl.length)return closeMp();mpi=Math.min(mpi,mpl.length-1);
  mpl.forEach((x,k)=>{const r=el('div','mi'+(k===mpi?' on':'')),av=el('div','av');setAv(av,x.e,x.c,x.n,x.i,x.bot);
   r.append(av,el('span','',x.n));if(x.bot)r.append(el('span','bt','BOT'));r.onmousedown=e=>{e.preventDefault();pickMp(k)};P.append(r)});P.classList.remove('hide')};
 const pickMp=k=>{const i=$('ci'),pos=i.selectionStart,m=/@([A-Za-z0-9_]*)$/.exec(i.value.slice(0,pos));if(!m||!mpl[k])return;
  const ins='@'+mpl[k].n+' ';i.value=i.value.slice(0,pos-m[0].length)+ins+i.value.slice(pos);const np=pos-m[0].length+ins.length;i.setSelectionRange(np,np);closeMp();i.focus()};
 $('cs').onclick=send;$('cp').onclick=sendChatImg;
 $('ci').oninput=()=>{mpi=0;drawMp()};
 $('ci').onblur=()=>setTimeout(closeMp,120);
 $('ci').onkeydown=e=>{const open=!$('mp').classList.contains('hide');
  if(open){if(e.key==='ArrowDown'){e.preventDefault();mpi=(mpi+1)%mpl.length;drawMp();return}
   if(e.key==='ArrowUp'){e.preventDefault();mpi=(mpi-1+mpl.length)%mpl.length;drawMp();return}
   if(e.key==='Tab'||e.key==='Enter'){e.preventDefault();pickMp(mpi);return}
   if(e.key==='Escape'){closeMp();return}}
  if(e.key==='Enter')send()};
 subs.push(db.collection('chat').orderBy('t','desc').limit(60).onSnapshot(s=>{
  const L=$('chatlog');if(!L)return;L.textContent='';
  const arr=s.docs.map(d=>({...d.data(),_id:d.id})).reverse();
  arr.forEach(c=>{if(!c.bot&&c.u)authors[c.u]={c:c.c,i:c.i}});
  if(!arr.length){const e=document.createElement('div');e.className='empty';e.textContent='No messages yet. Say something.';L.append(e)}
  let last=null,box=null;
  arr.forEach(c=>{
   if(!last||last.u!==c.u||c.t-last.t>300000){
    const grp=document.createElement('div'),av=document.createElement('div'),h=document.createElement('div'),n=document.createElement('b'),tm=document.createElement('span');
    grp.className='mg';av.className='av';setAv(av,c.e,c.c,c.u,c.i,!!c.bot);
    box=document.createElement('div');box.className='mb';h.className='mh2';n.textContent=c.u;tm.textContent=fmtT(c.t);h.append(n);if(c.bot)h.append(el('span','bt','BOT'));h.append(tm);box.append(h);grp.append(av,box);L.append(grp)}
   box.append(msgBlock(c,'chat/'+c._id,c.u===me.name||me.admin));last=c});
  L.scrollTop=L.scrollHeight}));
 const drawMem=()=>{const ml=$('ml');if(!ml)return;ml.textContent='';
  const on=mem.filter(m=>Date.now()-m.t<50000).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  $('mc').textContent=on.length;
  BOTL.forEach(x=>{const r=el('div','mm'),av=el('div','av'),w=el('div'),n=el('b','',x[0]),s=el('small','','bot - type @'+x[0]);setAv(av,x[1],x[2],x[0],'',1);w.append(n,s);r.append(av,w,el('span','dot'));ml.append(r)});
  on.forEach(m=>{const r=document.createElement('div'),av=document.createElement('div'),w=document.createElement('div'),n=document.createElement('b'),s=document.createElement('small'),d=document.createElement('span');
   r.className='mm';av.className='av';setAv(av,m.e,m.c,m.name,m.i);n.textContent=m.name;s.textContent='online - '+(m.at||'');d.className='dot';
   w.append(n,s);r.append(av,w,d);if(m.uid&&m.uid!==uid){r.style.cursor='pointer';r.title='Click to send a friend request';r.onclick=()=>{if(confirm('Send a friend request to '+m.name+'?'))reqFriend(m.name,t=>alert(t))}}ml.append(r)})};
 subs.push(db.collection('presence').onSnapshot(s=>{mem=s.docs.map(d=>d.data());drawMem()}));
}

/* GAME ODDS: editable by the admin (Admin tab), loaded from the server */
const ODDS_DEF={plinko:{w:[.5,5,17,14,11,5,11,14,17,5,.5]},slots:{trip:[7,3.5,1.5,.6,.3,.1],two:32},bj:{boost:0}};
const cloneO=o=>JSON.parse(JSON.stringify(o));
let ODDS=cloneO(ODDS_DEF),oddsT=0;
function normOdds(o){const d=cloneO(ODDS_DEF);
 try{if(Array.isArray(o.plinko.w)&&o.plinko.w.length===11)d.plinko.w=o.plinko.w.map(x=>Math.max(0,+x||0));
  if(Array.isArray(o.slots.trip)&&o.slots.trip.length===6)d.slots.trip=o.slots.trip.map(x=>Math.max(0,+x||0));
  d.slots.two=Math.max(0,+o.slots.two||0);d.bj.boost=Math.max(-50,Math.min(50,+o.bj.boost||0))}catch(e){}
 if(!(d.plinko.w.reduce((a,b)=>a+b,0)>0))d.plinko.w=ODDS_DEF.plinko.w.slice();
 return d}
async function loadOdds(){try{const j=await api({op:'odds'});ODDS=j&&j.odds?normOdds(j.odds):cloneO(ODDS_DEF);oddsT=Date.now()}catch(e){}}
const freshOdds=()=>Date.now()-oddsT>10000?loadOdds():0;

/* LEADERBOARD */
function vLB(){
 $('pane').innerHTML=`${ph('leaderboard','The richest players on the site. Updates every few seconds.')}

/* ---- chess bot (runs in a worker so the page never freezes) ---- */
function killBot(){if(botWorker){botWorker.terminate();botWorker=null}}
function newBot(level,color){const me2=color==='random'?(Math.random()<.5?'w':'b'):color==='white'?'w':'b';
 const g=new ChessEngine.Chess();return{g,level,me:me2,hist:[g.key()],sn:[],mv:[],over:null,thinking:false,gen:0}}
const botFallback=(fen,level)=>{try{return new ChessEngine.Chess(fen).think(level)}catch(e){return null}};
function botThink(fen,level){return new Promise(res=>{
 try{if(!botWorker)botWorker=new Worker('/chess-worker.js');
  const w=botWorker,id=++botReq,h=e=>{if(e.data.id!==id)return;w.removeEventListener('message',h);res(e.data.move)};
  w.addEventListener('message',h);w.onerror=()=>{killBot();res(botFallback(fen,level))};w.postMessage({id,fen,level})}
 catch(e){res(botFallback(fen,level))}})}
function botApply(m){const B=botG;B.sn.push(B.g.san(m));B.mv.push(B.g.uci(m));B.g.make(m);B.hist.push(B.g.key());
 const st=B.g.status(B.hist);if(st.over)B.over=st}
function botSync(){const B=botG;if(!B||!$('bsta'))return;
 const myTurn=!B.over&&B.g.turn()===B.me;
 botUI.set(B.g.fen(),B.mv.length?B.mv[B.mv.length-1]:null,B.me,myTurn&&!B.thinking);
 let st;
 if(B.over){const r=B.over.res;st=r==='d'?'Draw ('+B.over.why+').':(r===B.me?'You win \u2014 ':'The bot wins \u2014 ')+B.over.why+'.'}
 else if(B.thinking)st='The bot is thinking\u2026';
 else st='Your move'+(B.g.inCheck()?' \u2014 check!':'');
 $('bsta').textContent=st;
 const ml=$('bml');ml.textContent='';ml.append(mvList(B.sn));ml.firstChild.scrollTop=1e6}
function botNext(){const B=botG;if(!B||B.over||B.thinking||B.g.turn()===B.me)return;
 B.thinking=true;const gen=B.gen;botSync();
 botThink(B.g.fen(),B.level).then(u=>{if(botG!==B||B.gen!==gen)return;B.thinking=false;
  if(u){const m=B.g.parse(u.slice(0,2),u.slice(2,4),u[4]);if(m)botApply(m)}botSync()})}

function toggleMore(){const M=$('mgm'),b=$('mg');if(!M||!b)return;
 if(!M.classList.contains('hide'))return closeMore();
 M.classList.remove('hide');b.setAttribute('aria-expanded','true');
 const r=b.getBoundingClientRect();M.style.top=(r.bottom+4)+'px';M.style.maxHeight='calc(100vh - '+(r.bottom+16)+'px)';
 M.style.left=Math.max(8,Math.min(r.left,innerWidth-M.offsetWidth-8))+'px';
 const f=M.querySelector('.ddi.on')||M.querySelector('.ddi');if(f)f.focus()}
document.addEventListener('click',e=>{if(e.target.closest('#mg')||e.target.closest('#mgm'))return;closeMore()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMore()});
addEventListener('resize',closeMore);

const frameAttrs='fullscreen; autoplay; clipboard-read; clipboard-write; gamepad';
function mkFrame(url,ext){const f=document.createElement('iframe');f.className='gframe';f.setAttribute('allow',frameAttrs);f.allowFullscreen=true;
 /* third-party games run sandboxed (no top-level navigation); your own hosted files keep full access like before */
 if(ext)f.setAttribute('sandbox','allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals');
 f.src=url;return f}
function gameShell(title,hint,url,ext,extra){
 $('pane').innerHTML=ph('x','')+'<div class="panel"><div class="bd"><div class="row" id="gbar"></div></div><div id="gfw"></div></div>';
 const h=$('pane').querySelector('h1');h.textContent=title;
 const p=$('pane').querySelector('.ph p')||h.parentNode.appendChild(document.createElement('p'));p.textContent=hint||'Click inside the game to play. Big games can take a while to load.';
 let cur=url,fr=mkFrame(cur,ext);$('gfw').append(fr);
 const a=el('a','btn sm','Open in new tab');a.href=url;a.target='_blank';a.rel='noopener';a.style.textDecoration='none';
 const swap=u=>{cur=u;const n=mkFrame(cur,ext);fr.replaceWith(n);fr=n;a.href=u};
 $('gbar').append(...(extra||[]).map(x=>x.alt?btn('Backup version',()=>swap(x.alt)):x),
  btn('Fullscreen',()=>{if(fr.requestFullscreen)fr.requestFullscreen()}),btn('Reload',()=>swap(cur)),a)}

let gQ='',gC='All';
function vGames(){
 const games=ARCADE.slice().sort((a,b)=>a[1].localeCompare(b[1]));
 $('pane').innerHTML=ph('games','Pick a game and click it to play right here.')+`<div class="panel"><div class="bd"><input id="lq" placeholder="search games" autocomplete="off" aria-label="Search games"><div class="row" id="lc" style="margin-top:10px"></div></div><div class="lgrid" id="lg"></div></div>`;
 const cats=['All',...[...new Set(games.flatMap(g=>g[7]))].sort()];
 const open=g=>gameShell(g[1],g[3],g[2],!!g[4],[btn('\u2190 All games',()=>vGames())].concat(g[8]?[{alt:g[8]}]:[]));
 const draw=()=>{const L=$('lg');if(!L)return;L.textContent='';
  const q=gQ.trim().toLowerCase(),list=games.filter(g=>(gC==='All'||g[7].includes(gC))&&(!q||g[1].toLowerCase().includes(q)));
  if(!list.length){L.append(el('div','empty','No games match.'));return}
  list.forEach(g=>{const c=el('button','lcard'),th=el('div','th',g[1]);c.type='button';c.title=g[1];
   th.style.background='linear-gradient(135deg,'+g[6][0]+','+g[6][1]+')';
   c.append(th);c.onclick=()=>open(g);L.append(c)})};
 const chips=()=>{const C=$('lc');C.textContent='';cats.forEach(c=>{const b=btn(c,()=>{gC=c;chips();draw()});if(c===gC)b.classList.add('pri');C.append(b)})};
 $('lq').value=gQ;$('lq').oninput=()=>{gQ=$('lq').value;draw()};chips();draw()}
init();
</script>
